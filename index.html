<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0d">
    <title>روابطي | Ellbey FF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --text: #f7f6f4;
            --text-muted: #b9b8c2;
            --accent: #ff5127;
            --accent-soft: #ffb08a;
            --surface: rgba(14, 13, 18, 0.52);
            --surface-strong: rgba(20, 19, 24, 0.72);
            --line: rgba(255, 255, 255, 0.14);
            --line-strong: rgba(255, 255, 255, 0.24);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100dvh;
            color: var(--text);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ---------- خلفية واضحة جداً - بدون تأثيرات قوية ---------- */
        .background {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: url("background.jpg") center/cover no-repeat;
            transform: scale(1);
            animation: bgIn 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            filter: brightness(1.15) saturate(1.2) contrast(1.08);
        }
        @keyframes bgIn {
            from { 
                transform: scale(1.02); 
                filter: brightness(0.95) saturate(1.1) contrast(1.05);
            }
            to   { 
                transform: scale(1); 
                filter: brightness(1.15) saturate(1.2) contrast(1.08);
            }
        }

        /* طبقات شفافة جداً جداً - كادت تكون غير موجودة */
        .scrim-top {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 140px;
            z-index: -1;
            background: linear-gradient(180deg, rgba(0,0,0,0.05), transparent);
            pointer-events: none;
        }
        .scrim-bottom {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 120px;
            z-index: -1;
            background: linear-gradient(0deg, rgba(0,0,0,0.08), transparent);
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 360px;
            padding: 72px 16px 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
            flex: 1;
        }

        /* ---------- avatar: يبرز على الخلفية ---------- */
        .avatar-wrap {
            position: relative;
            width: 118px;
            height: 118px;
            margin-bottom: -59px;
            z-index: 3;
            opacity: 0;
            animation: dropIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.5s;
        }
        @keyframes dropIn {
            from { opacity: 0; transform: translateY(-10px) scale(0.94); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .avatar-ring {
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: conic-gradient(from 200deg, var(--accent), #ffd39b, var(--accent));
            padding: 3px;
        }
        .avatar-ring::after {
            content: "";
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            border: 3px solid #0e0d12;
        }
        .avatar-wrap img {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            box-shadow: 0 12px 30px rgba(0,0,0,0.45);
        }
        .badge {
            position: absolute;
            bottom: 4px;
            left: 4px;
            width: 28px;
            height: 28px;
            background: var(--accent);
            border: 3px solid #0e0d12;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 4;
        }
        .badge svg { width: 13px; height: 13px; fill: #0e0d12; }

        /* ---------- الكارت الرئيسي - شفاف جداً ---------- */
        .card {
            width: 100%;
            background: rgba(14, 13, 18, 0.25);
            backdrop-filter: blur(12px) saturate(140%);
            -webkit-backdrop-filter: blur(12px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 22px;
            padding: 72px 20px 30px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
            opacity: 0;
            animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.25s;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .name-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-bottom: 5px;
        }
        .name {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.3px;
            color: var(--text);
        }
        .verified {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        .verified svg { width: 100%; height: 100%; }

        .username {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 600;
            direction: ltr;
            margin-bottom: 14px;
        }
        .username span { color: var(--accent-soft); }

        .description {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.75;
            max-width: 320px;
            margin: 0 auto 26px;
        }

        .social-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 26px;
        }
        .social-row a {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-muted);
            transition: border-color 0.25s ease, color 0.25s ease, transform 0.25s ease, background 0.25s ease;
        }
        .social-row a svg { width: 19px; height: 19px; fill: currentColor; }
        .social-row a:hover {
            border-color: var(--accent);
            color: var(--accent-soft);
            background: rgba(255, 81, 39, 0.12);
            transform: translateY(-3px);
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 11px;
            width: 100%;
            margin-bottom: 22px;
        }

        .link {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 58px;
            padding: 0 20px;
            text-decoration: none;
            color: var(--text);
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            font-size: 15.5px;
            font-weight: 700;
            transition: border-color 0.25s ease, background 0.25s ease, transform 0.2s ease;
            overflow: hidden;
        }
        .link::before {
            content: "";
            position: absolute;
            inset-inline-start: 0;
            top: 0; bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, var(--accent), var(--accent-soft));
            transform: scaleY(0);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .link:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255,255,255,0.1);
            transform: translateY(-2px);
        }
        .link:hover::before { transform: scaleY(1); }

        .icon {
            width: 21px;
            height: 21px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: color 0.25s ease;
        }
        .icon svg { width: 100%; height: 100%; fill: currentColor; }
        .link:hover .icon { color: var(--accent-soft); }

        .link-text {
            flex: 1;
            text-align: center;
            padding-inline-end: 21px;
        }
        .link-arrow {
            font-size: 13px;
            color: var(--text-muted);
            opacity: 0.6;
        }

        .share-button {
            width: 100%;
            min-height: 50px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 14px;
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            transition: border-color 0.25s ease, color 0.25s ease, background 0.25s ease;
        }
        .share-button:hover {
            border-color: var(--accent);
            color: var(--accent-soft);
            background: rgba(255, 81, 39, 0.1);
        }
        .share-button svg { width: 17px; height: 17px; fill: currentColor; }

        footer {
            margin-top: 22px;
            color: rgba(255,255,255,0.65);
            font-size: 12px;
            font-weight: 600;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }

        @media (max-width: 400px) {
            .container { max-width: 320px; padding: 56px 12px 24px; }
            .avatar-wrap { width: 100px; height: 100px; margin-bottom: -50px; }
            .card { padding: 56px 16px 24px; border-radius: 18px; }
            .name { font-size: 22px; }
            .link { min-height: 52px; font-size: 14.5px; }
        }

        @media (min-width: 600px) {
            .container { max-width: 380px; }
        }
    </style>
</head>

    <script>
        async function sharePage() {
            const shareData = {
                title: 'روابطي | Ellbey FF',
                text: 'تابعني على جميع منصات التواصل الاجتماعي',
                url: window.location.href
            };

            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                } catch (err) {
                    // المستخدم ألغى المشاركة أو حدث خطأ
                }
                return;
            }

            // للأجهزة التي لا تدعم الواجهة الأصلية
            const whatsappUrl = 'https://api.whatsapp.com/send?text=' +
                encodeURIComponent(shareData.text + ' ' + shareData.url);
            window.open(whatsappUrl, '_blank', 'noopener,noreferrer');
        }
    </script>
